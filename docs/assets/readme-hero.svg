<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Codex Quota Monitor product overview</title>
  <desc id="desc">A synthetic Codex workspace with a local quota and context monitor overlay. No real account or conversation data is shown.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07110f"/>
      <stop offset="0.48" stop-color="#0a1218"/>
      <stop offset="1" stop-color="#07100f"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
