    <radialGradient id="glow">
      <stop offset="0" stop-color="#4ce2a1" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#4ce2a1" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
